scenario_name: cooperative_docking_paper_replay
scenario_description: Synthetic aligned cooperative rendezvous with a time-limited
  readiness promise.
objects:
  target:
    kind: satellite
    specs:
      mass_kg: 100
      mass_properties:
        inertia_kg_m2:
        - - 25
          - 0
          - 0
        - - 0
          - 25
          - 0
        - - 0
          - 0
          - 20
        inertia_reference_point: center_of_mass
      flight_software_hardware:
        max_force_n: 8.0
        max_torque_n_m: 1.5
    initial_state:
      position_eci_km:
      - 7000
      - 0
      - 0
      velocity_eci_km_s:
      - 0
      - 7.5
      - 0
      attitude_quat_bn:
      - 1
      - 0
      - 0
      - 0
      angular_rate_body_rad_s:
      - 0
      - 0
      - 0
    knowledge:
      numeric_backend: python
    flight_software:
      module: lease_stacks
      class_name: LeaseStack
      hardware_profile: hardware.ideal_wrench.v1
      task_period_s: 0.0625
      params:
        role: receiver
        policy: turnaround_corrected
        grant_ns: 62500000
        lease_ns: 1150000000
        messages: []
        lag_ns: 62500000
        epoch_ns: -200000000000
        rate_ppm: -1000
        receiver_accel: 0.0
        measurement_bias:
        - 0.0004
        - 0.0008
        promise_break_ns: null
        navigation_initialization: ideal
        tilt_bound_rad: 0.0
        resolve_wrench: false
  chaser:
    kind: satellite
    specs:
      mass_kg: 100
      mass_properties:
        inertia_kg_m2:
        - - 25
          - 0
          - 0
        - - 0
          - 25
          - 0
        - - 0
          - 0
          - 20
        inertia_reference_point: center_of_mass
      flight_software_hardware:
        max_force_n: 8.0
        max_torque_n_m: 1.5
    initial_state:
      position_eci_km:
      - 7000.0
      - 0.0
      - 0.001045
      velocity_eci_km_s:
      - 0
      - 7.5
      - -3.9e-05
      attitude_quat_bn:
      - 0
      - 1
      - 0
      - 0
      angular_rate_body_rad_s:
      - 0
      - 0
      - 0
    knowledge:
      numeric_backend: python
    flight_software:
      module: lease_stacks
      class_name: LeaseStack
      hardware_profile: hardware.ideal_wrench.v1
      task_period_s: 0.03125
      params:
        role: chaser
        policy: turnaround_corrected
        grant_ns: 62500000
        lease_ns: 1150000000
        messages:
        - - 93750000
          - 2
          - 1150000000
          - 31218750
        lag_ns: 62500000
        epoch_ns: 1091000000000
        rate_ppm: 1000
        receiver_accel: 0.0
        measurement_bias:
        - 0.0004
        - 0.0008
        promise_break_ns: null
        navigation_initialization: ideal
        tilt_bound_rad: 0.0
        resolve_wrench: false
simulator:
  duration_s: 2.0
  dt_s: 0.015625
  dynamics:
    orbit:
      model: two_body
      integrator: rk4
      numeric_backend: python
    attitude:
      enabled: true
      numeric_backend: python
    rocket:
      numeric_backend: python
    reentry:
      numeric_backend: python
  docking:
    enabled: true
    probe:
      object_id: chaser
      offset_body_m:
      - 0
      - 0
      - 0.5
      radius_m: 0.2
    receiver:
      object_id: target
      offset_body_m:
      - 0
      - 0
      - 0.5
      radius_m: 0.25
    max_step_s: 0.00390625
    contact_stiffness_n_m: 1500
    contact_damping_n_s_m: 25
    max_compression_m: 0.025
    latch:
      capture_lateral_m: 0.02
      capture_angle_rad: 0.05
      capture_speed_m_s: 0.15
      capture_rate_rad_s: 0.1
      stiffness_n_m: 500
      damping_n_s_m: 280
      angular_stiffness_n_m_rad: 100
      angular_damping_n_m_s_rad: 80
      max_travel_m: 0.05
      max_force_n: 150
      max_torque_n_m: 40
    commanded: true
outputs:
  mode: save
  output_dir: outputs/cooperative_docking_paper_replay
  stats:
    save_full_log: false
    print_summary: false
  plots:
    enabled: false
  review:
    enabled: true
    detail: full
schema_version: oel.scenario.v1
